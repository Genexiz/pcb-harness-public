[project]
name = "pcb-harness"
version = "0.0.1"
description = "KiCad-grounded PCB design harness; initial capability probes"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["kicad-python==0.8.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "mcp==2.3.0", "resvg-py==0.5.0", "Pillow==12.3.0"]
mcp = ["mcp==2.3.0", "resvg-py==0.5.0", "Pillow==12.3.0"]
capture = ["pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'"]

[project.scripts]
pcb-harness-mcp = "pcb_harness.mcp_server:main"

[build-system]
requires = ["setuptools>=65", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pcb_harness.circuit" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "experiments/kicad-ipc"]
addopts = "-ra"
